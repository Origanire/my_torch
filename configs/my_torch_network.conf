; Réseau rendu. Chaque valeur est justifiée dans doc/hyperparametres.md

[network]
input_size = 769
output_size = 5
hidden_layers = 512, 256
activation = relu
init = he
dropout = 0.2

[training]
optimizer = adam
learning_rate = 0.001
batch_size = 256
epochs = 100
weight_decay = 0.0001
lr_decay = 1.0
validation_split = 0.1
patience = 8
seed = 42
